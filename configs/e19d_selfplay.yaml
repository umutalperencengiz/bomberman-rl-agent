notes: 'EXP-019D: en zayif rakibi KENDI EN IYI AJANIMIZLA degistir. e19b/e20a rakip
  havuzu rule_based + coin_collector + Qlearned_agent; Qlearned EK-2''de 2.953 aliyor,
  yani havuzun en zayif halkasi. pool_e19b = e19b_types_s2''nin bagimsiz snapshot''i,
  EK-2''de 4.210. TEK DEGISKEN: ucuncu rakip Qlearned_agent -> pool_e19b. Gerekce:
  kaldirac tablosunda skoru oynatan her sey ''neye karsi egitildigi'' oldu (+1.865
  odul hizalamasi, +0.792 rakip maruziyeti, +0.254 rakip tipi); optimizer ekseninde
  olculmus kazanc yok. NOT: EXP-019''un e19c_league kolu bu ekseni test ETMEYE calismisti
  ama havuz ajaninin model dosyasi eksikti ve RASTGELE agirliklarla oynadi -- kol
  gecersiz. Bu sefer snapshot uc kapidan geciriliyor (selfplay.verify).'
